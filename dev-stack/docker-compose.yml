# Local stack: FacturaScripts + MariaDB.
#
# Secrets live in dev-stack/.env (git-ignored), never in this file.
#   FS_DB_PASS / MARIADB_ROOT_PASSWORD / FS_INITIAL_PASS are generated by
#   `dev-stack/install.sh` on first run.
name: facturascripts

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: facturascripts-app:8.3
    container_name: facturascripts-app
    restart: unless-stopped
    ports:
      # Bind address comes from dev-stack/.env (FS_BIND_ADDR); install.sh sets it
      # to the tailnet address so the app is reachable on the tailnet only.
      - "${FS_BIND_ADDR:-127.0.0.1}:8180:80"
    volumes:
      - ..:/var/www/html
    environment:
      FS_DB_TYPE: mysql
      FS_DB_HOST: db
      FS_DB_PORT: "3306"
      FS_DB_NAME: facturascripts
      FS_DB_USER: facturascripts
      FS_DB_PASS: ${FS_DB_PASS:?missing FS_DB_PASS in dev-stack/.env}
      FS_INITIAL_USER: ${FS_INITIAL_USER:-admin}
      FS_INITIAL_PASS: ${FS_INITIAL_PASS:?missing FS_INITIAL_PASS in dev-stack/.env}
      FS_LANG: ${FS_LANG:-fr_FR}
      FS_DEBUG: "false"
    dns:
      - 8.8.8.8   # Tailscale DNS is hijacked for containers, see skill docker-tailscale-dns
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: facturascripts-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?missing MARIADB_ROOT_PASSWORD in dev-stack/.env}
      MARIADB_DATABASE: facturascripts
      MARIADB_USER: facturascripts
      MARIADB_PASSWORD: ${FS_DB_PASS:?missing FS_DB_PASS in dev-stack/.env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_520_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
